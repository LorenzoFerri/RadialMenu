[layout]

; Global radial size multiplier.
scale = 1.00

; Normalized screen position. 0.50, 0.50 is the center of the screen.
center_x = 0.50
center_y = 0.50

; Pixel offset applied after center_x / center_y.
offset_x = 0
offset_y = 0

[wheel]

hidden = false

; Sizes are in 1080p design pixels and scale with the game window.
inner_size = 120
outer_size = 250

; Hex colors accept #RRGGBB or #RRGGBBAA.
background_color = #181613e0
border_color = #6e5f41b4

[central_panel]

hidden = false
outer_size = 112
background_color = #181613e0
border_color = #ab946abe

[item_spell_slot]

inner_size = 128
outer_size = 242
background_color = #181613e0
selected_background_color = #28241ee8
border_color = #6e5f41b4
selected_sorcery_border_color = #9bf0ffff
selected_incantation_border_color = #ffdbaaff

; Slot decoration: inner/outer arcs and separator lines.
details = true

; Degrees of empty space between radial slices.
gap_degrees = 3.0

[editor]

; Toggle the in-game config editor.
toggle_key = F7
toggle_shift = true
toggle_ctrl = false
toggle_alt = false
