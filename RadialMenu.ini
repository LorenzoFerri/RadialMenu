[radial_menu]

; Global radial size multiplier.
scale = 1.00

; Normalized screen position. 0.50, 0.50 is the center of the screen.
center_x = 0.50
center_y = 0.50

; Pixel offset applied after center_x / center_y.
offset_x = 0
offset_y = 0

; Advanced wheel shape controls, in 1080p design pixels.
wheel_inner_radius = 120
wheel_outer_radius = 250
icon_size = 80

; Degrees of empty space between radial slices.
gap_size = 3.0

; Spacing between nearby concentric rings, in 1080p design pixels.
ring_padding = 8

; Opacity values range from 0.00 to 1.00.
opacity = 1.00
screen_dim_opacity = 0.30

; Set false for a see-through center hole and no selected-item details.
show_center_panel = true
show_controls = true

; Toggle the in-game config editor.
editor_toggle_key = F7
editor_toggle_shift = true
editor_toggle_ctrl = false
editor_toggle_alt = false

[colors]

; Hex colors accept #RRGGBB or #RRGGBBAA.
screen_dim_color = #000000ff
background_color = #181613e0
selected_color = #28241ee8
border_color = #6e5f41b4
accent_color = #ab946abe
text_color = #f4eedfff
icon_color = #ffffffff
sorcery_color = #9bf0ffff
incantation_color = #ffdbaaff
spell_color = #dce6ebff
